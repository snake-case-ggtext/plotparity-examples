# plotnine-ggtext tested against the ggtext cases. Run from this directory: `plotparity run`.
cases = "../../cases/ggtext"
from = "git+https://github.com/snake-case-ggtext/plotnine-ggtext@294826676a22e53b9dec06f0789b16610ddccfc1"
known_good = "git+https://github.com/snake-case-ggtext/plotnine-ggtext@294826676a22e53b9dec06f0789b16610ddccfc1"
default_split = "dev"
# Names R ggtext exports: a case using one the package lacks is reported as missing_api.
api = ["geom_richtext", "geom_textbox", "element_markdown", "element_textbox", "element_textbox_simple"]

# Globs over folder/id inside the cases folder. Splits must not overlap.
[splits]
dev = [
  "geom_richtext/richtext_rotated_colors",
  "geom_richtext/richtext_example_markup",
  "geom_richtext/richtext_example_no_frame",
  "geom_textbox/textbox_rotated_alignments",
  "geom_textbox/textbox_example_npc_width",
  "markup/richtext_feature_matrix_css",
]
holdout = [
  "geom_richtext/richtext_text_color_alpha",
  "geom_textbox/textbox_size_limits_paragraphs",
  "geom_textbox/textbox_native_no_wrap",
  "markup/richtext_feature_matrix_scripts",
]
coverage = ["elements/*", "markup/markdown_sub_sup_syntax", "markup/r_colour_names", "markup/richtext_img"]
