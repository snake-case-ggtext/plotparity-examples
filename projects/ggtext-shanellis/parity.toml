# Shannon Ellis's `ggtext` package tested against the ggtext cases. Run from this directory: `plotparity run`.
cases = "../../cases/ggtext"
from = "git+https://github.com/snake-case-ggtext/ggtext_ShanEllis@9d845be9a32256b85fcc0e404b799f56f1611f43"
api = ["geom_richtext", "geom_textbox", "element_markdown", "element_textbox", "element_textbox_simple"]

[splits]
dev = ["geom_richtext/*", "geom_textbox/*"]
holdout = ["markup/*"]
coverage = ["elements/*"]
